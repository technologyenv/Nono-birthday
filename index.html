<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Surprise | نونو</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #ff758c; --secondary: #ffafbd; }
        body { margin: 0; padding: 0; font-family: 'Cairo', sans-serif; background: #fdfdfe; min-height: 100vh; overflow-x: hidden; }
        
        /* شاشة البداية */
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 1000; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .enter-btn { background: var(--primary); color: white; border: none; padding: 15px 40px; border-radius: 50px; font-size: 1.3em; cursor: pointer; box-shadow: 0 10px 20px rgba(255, 117, 140, 0.3); animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

        #mainContent { opacity: 0; transition: opacity 1s ease-in; display: flex; flex-direction: column; align-items: center; text-align: center; width: 100%; }
        .container { background: white; padding: 35px 25px; border-radius: 35px; box-shadow: 0 20px 50px rgba(0,0,0,0.06); width: 85%; max-width: 420px; margin: 40px 20px; border: 1px solid #fceef0; position: relative; }

        /* ستايل السلايدر */
        .slider-frame { position: relative; width: 100%; height: 380px; border-radius: 25px; overflow: hidden; margin: 20px 0; border: 4px solid #fff; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .slider-frame img { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; opacity: 0; transition: opacity 1.5s; }
        .slider-frame img.active { opacity: 1; }

        /* عداد الصداقة */
        .friendship-timer { font-size: 0.8em; color: #888; margin-top: 5px; }

        /* الكارت اللي بيلف */
        .flip-card { background-color: transparent; width: 100%; height: 200px; perspective: 1000px; margin: 30px 0; }
        .flip-card-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.8s; transform-style: preserve-3d; cursor: pointer; }
        .flip-card:hover .flip-card-inner { transform: rotateY(180deg); }
        .flip-front, .flip-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 20px; display: flex; align-items: center; justify-content: center; flex-direction: column; }
        .flip-front { background: var(--secondary); color: white; border: 2px dashed white; }
        .flip-back { background: var(--primary); color: white; transform: rotateY(180deg); padding: 10px; }

        /* زرار الرسايل العشوائية */
        .magic-btn { background: white; color: var(--primary); border: 2px solid var(--primary); padding: 10px 20px; border-radius: 25px; cursor: pointer; font-weight: bold; transition: 0.3s; margin-top: 15px; }
        .magic-btn:hover { background: var(--primary); color: white; }
        #random-msg { margin-top: 15px; font-style: italic; color: #ff4d6d; min-height: 40px; }

        /* البلالين والقلوب */
        .floating { position: fixed; pointer-events: none; z-index: -1; animation: moveUp 6s linear forwards; }
        @keyframes moveUp { 0% { transform: translateY(110vh) rotate(0); opacity: 1; } 100% { transform: translateY(-20vh) rotate(360deg); opacity: 0; } }
        
        .english-quote { font-family: 'Dancing Script', cursive; font-size: 1.5em; color: var(--primary); margin: 20px 0; direction: ltr; }
        #myAudio { display: none; }
    </style>
</head>
<body>

    <div id="overlay">
        <h2 style="color: #ff758c;">جاهز للمفاجأة؟ ✨</h2>
        <button class="enter-btn" onclick="startEverything()">افتح الهدية 🎁</button>
    </div>

    <div id="mainContent">
        <div id="floating-container"></div>
        <div class="container">
            <h1>كل سنة وأنت طيب يا نونو ✨</h1>
            <div id="countdown" style="color: var(--primary); font-weight: bold;">جاري الحساب...</div>
            <div class="friendship-timer" id="friendship">منور دنيتي من زمان ❤️</div>
            
            <div class="slider-frame" id="slider1">
                <img src="1.jpg" class="active"><img src="2.jpg"><img src="3.jpg">
            </div>

            <p style="color: #555;">ذكرياتنا هي أحلى حاجة حصلت في حياتي..</p>

            <div class="flip-card">
                <div class="flip-card-inner">
                    <div class="flip-front">
                        <h3>المس الكارت ده 🃏</h3>
                        <p>في سر هنا..</p>
                    </div>
                    <div class="flip-back">
                        <p>إنت مش بس نونو، إنت أغلى صديق وجزء كبير من يومي.. خليك دايماً مبسوط! ❤️</p>
                    </div>
                </div>
            </div>

            <div class="slider-frame" id="slider2">
                <img src="new1.jpg" class="active"><img src="new2.jpg"><img src="new3.jpg">
            </div>

            <div class="english-quote">
                "To the person who makes every moment feel like magic." ✨
            </div>

            <button class="magic-btn" onclick="showMsg()">دوس هنا وشوف حظك 💌</button>
            <div id="random-msg"></div>

            <audio id="myAudio" loop><source src="music.mp3" type="audio/mpeg"></audio>
        </div>
    </div>

    <script>
        // الباسورد في البداية
        function checkPassword() {
            var p = prompt("أدخل تاريخ ميلادك السري (20/4/2000):");
            if (p === "20/4/2000") { document.getElementById("overlay").style.display = "flex"; }
            else { alert("ركز يا نونو!"); checkPassword(); }
        }
        window.onload = checkPassword;

        function startEverything() {
            document.getElementById("myAudio").play();
            document.getElementById("overlay").style.display = "none";
            document.getElementById("mainContent").style.opacity = "1";
            setInterval(createFloating, 400);
        }

        // عداد عيد الميلاد + عداد الصداقة
        const birthday = new Date("April 13, 2026 00:00:00").getTime();
        const knowEachOther = new Date("March 26, 2026").getTime(); // غيري التاريخ ده ليوم ما عرفتوا بعض

        setInterval(() => {
            const now = new Date().getTime();
            // عداد الميلاد
            const diffB = birthday - now;
            const dB = Math.floor(diffB / 86400000);
            const hB = Math.floor((diffB % 86400000) / 3600000);
            document.getElementById("countdown").innerHTML = `باقي ${dB} يوم و ${hB} ساعة على يومك الكبير 🎂`;

            // عداد الصداقة
            const diffF = now - knowEachOther;
            const dF = Math.floor(diffF / 86400000);
            document.getElementById("friendship").innerHTML = `إحنا مع بعض بقالنا ${dF} يوم من السعادة! ❤️`;
        }, 1000);

        // الرسايل العشوائية
        const msgs = [
            "ضحكتك بتنور الدنيا ✨",
            "إنت بجد شخص مفيش منك اتنين!",
            "يوم ميلادك هو أحلى يوم في السنة 🎈",
            "يا رب دايماً ناجح ومبسوط يا نونو ❤️",
            "ممنونة جداً لكل لحظة قضيتها معاك",
            "خليك واثق إن اللي جاي أحلى بكتير 🌟"
        ];
        function showMsg() {
            const m = msgs[Math.floor(Math.random()*msgs.length)];
            document.getElementById("random-msg").innerHTML = m;
        }

        // السلايدرز
        function runSlider(id) {
            let curr = 0; const imgs = document.querySelectorAll(`#${id} img`);
            setInterval(() => {
                imgs[curr].classList.remove('active');
                curr = (curr + 1) % imgs.length;
                imgs[curr].classList.add('active');
            }, 4000);
        }
        runSlider('slider1'); runSlider('slider2');

        // قلوب وبلالين
        function createFloating() {
            const el = document.createElement("div");
            const items = ["❤️", "🎈", "✨", "🌸"];
            el.innerHTML = items[Math.floor(Math.random()*items.length)];
            el.className = "floating";
            el.style.left = Math.random() * 100 + "vw";
            el.style.fontSize = (Math.random() * 20 + 15) + "px";
            document.getElementById("floating-container").appendChild(el);
            setTimeout(() => el.remove(), 6000);
        }
    </script>
</body>
</html>
