<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Surprise | نونو ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --main-pink: #ff85a1; /* Candy Pink */
            --darker-pink: #f06292; 
            --soft-pink: #ffebee;
            --bg-pink: #fce4ec; 
            --gold: #ffeb3b;
        }
        
        body { 
            margin: 0; padding: 0; font-family: 'Cairo', sans-serif; 
            background: var(--bg-pink); color: #880e4f;
            min-height: 100vh; overflow-x: hidden;
            position: relative; /* عشان العناصر الطائرة */
        }

        /* --- شاشة الباسورد --- */
        #password-gate {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-pink); z-index: 2000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .pass-card {
            background: white; padding: 40px; border-radius: 30px;
            box-shadow: 0 15px 35px rgba(255,133,161,0.3); border: 2px solid var(--main-pink);
            text-align: center; width: 85%; max-width: 350px;
        }
        input#passInput {
            width: 100%; padding: 12px; margin: 20px 0; border-radius: 15px;
            border: 2px solid var(--soft-pink); text-align: center; font-size: 1.1em; outline: none;
            background: #fff; color: var(--darker-pink); font-weight: bold;
        }

        /* --- شاشة الدخول --- */
        #overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: var(--main-pink); z-index: 1000; display: none; 
            flex-direction: column; align-items: center; justify-content: center; 
        }
        .enter-btn { 
            background: white; color: var(--main-pink); border: none; 
            padding: 15px 40px; border-radius: 50px; font-size: 1.3em; 
            cursor: pointer; font-weight: 800; box-shadow: 0 10px 20px rgba(0,0,0,0.1); 
            animation: pulse 2s infinite; 
        }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }

        /* --- المحتوى الرئيسي --- */
        #mainContent { 
            opacity: 0; transition: opacity 1s ease-in; 
            display: flex; flex-direction: column; align-items: center; text-align: center; width: 100%; 
        }

        .container { 
            background: white; padding: 35px 25px; border-radius: 35px; 
            box-shadow: 0 20px 50px rgba(255,133,161,0.2); width: 85%; max-width: 420px; 
            margin: 40px 20px; border: 1px solid var(--soft-pink); 
            position: relative; /* لفراشات الزوايا */
            z-index: 10;
        }

        /* --- الفراشات الثابتة فوق الصور --- */
        .corner-butterfly { position: absolute; font-size: 25px; opacity: 0.8; z-index: 5; animation: flutter 3s infinite ease-in-out; }
        .cb-1 { top: -10px; left: -10px; }
        .cb-2 { top: -10px; right: -10px; transform: scaleX(-1); }
        .cb-3 { bottom: -10px; left: -10px; transform: scaleY(-1); }
        .cb-4 { bottom: -10px; right: -10px; transform: scale(-1); }
        @keyframes flutter { 0%, 100% { transform: rotate(0deg) translateY(0); } 50% { transform: rotate(10deg) translateY(-5px); } }

        /* --- القلب النابض باسم نونو --- */
        .nono-heart-container { margin: 20px 0; display: flex; align-items: center; justify-content: center; position: relative; }
        .nono-heart { font-size: 80px; color: var(--darker-pink); animation: beat 1.2s infinite; cursor: pointer; position: relative; display: inline-block; }
        .nono-heart::after { content: 'Nono'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-family: 'Cairo', sans-serif; font-weight: 800; font-size: 0.3em; text-shadow: 1px 1px 3px rgba(0,0,0,0.3); }
        @keyframes beat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }

        /* --- السلايدر --- */
        .slider-frame { 
            position: relative; width: 100%; height: 380px; border-radius: 25px; 
            overflow: hidden; margin: 20px 0; border: 4px solid white; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.1); z-index: 1;
        }
        .slider-frame img { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; opacity: 0; transition: opacity 1.5s; }
        .slider-frame img.active { opacity: 1; }

        /* --- العدادات --- */
        #countdown { color: var(--darker-pink); background: white; padding: 12px; border-radius: 50px; border: 2px solid var(--soft-pink); font-weight: bold; margin: 15px 0; box-shadow: 0 5px 15px rgba(255,133,161,0.1); }
        .friendship-box { background: var(--soft-pink); padding: 15px; border-radius: 20px; margin: 20px 0; border: 1px solid var(--main-pink); box-shadow: inset 0 0 10px rgba(255,255,255,0.5); }
        #friendship-counter { font-weight: bold; color: var(--darker-pink); font-size: 1.1em; }

        /* --- العجلة الكريتيف --- */
        .wheel-container { margin: 30px 0; position: relative; display: flex; flex-direction: column; align-items: center; z-index: 1; }
        #wheel { width: 200px; height: 200px; border-radius: 50%; border: 5px solid white; box-shadow: 0 0 20px rgba(255,133,161,0.5); transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99); background: conic-gradient(var(--main-pink) 0deg 60deg, var(--darker-pink) 60deg 120deg, var(--main-pink) 120deg 180deg, var(--darker-pink) 180deg 240deg, var(--main-pink) 240deg 300deg, var(--darker-pink) 300deg 360deg); }
        .wheel-pointer { width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 30px solid #880e4f; position: absolute; top: -10px; z-index: 10; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.2)); }

        /* --- الكارت --- */
        .flip-card { background-color: transparent; width: 100%; height: 180px; perspective: 1000px; margin: 25px 0; }
        .flip-card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.8s; transform-style: preserve-3d; cursor: pointer; }
        .flip-card:hover .flip-card-inner { transform: rotateY(180deg); }
        .flip-front, .flip-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 20px; display: flex; align-items: center; justify-content: center; flex-direction: column; padding: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .flip-front { background: var(--main-pink); color: white; border: 2px dashed rgba(255,255,255,0.5); }
        .flip-back { background: var(--darker-pink); color: white; transform: rotateY(180deg); }

        /* --- الأزرار والعناصر الطائرة --- */
        .magic-btn { background: var(--main-pink); color: white; border: none; padding: 12px 25px; border-radius: 25px; cursor: pointer; font-weight: bold; margin-top: 15px; box-shadow: 0 5px 15px rgba(255,133,161,0.3); transition: 0.3s; }
        .magic-btn:hover { background: var(--darker-pink); transform: scale(1.05); }
        
        .floating { position: fixed; pointer-events: none; z-index: -1; animation: moveUp 6s linear forwards; opacity: 0.8; }
        @keyframes moveUp { 0% { transform: translateY(110vh) rotate(0); opacity: 1; } 100% { transform: translateY(-20vh) rotate(360deg); opacity: 0; } }
        
        .english-quote { font-family: 'Dancing Script', cursive; font-size: 1.8em; color: var(--darker-pink); margin: 20px 0; text-shadow: 1px 1px 0px white; }
    </style>
</head>
<body>

        <div class="pass-card">
            <div class="nono-heart" style="font-size: 50px; animation: beat 1.5s infinite;"></div>
            <h2 style="color: var(--darker-pink); margin: 10px 0 0 0;">🔐 قفل المفاجأة</h2>
            <p style="color: #666; margin-top: 5px;">أدخل التاريخ السري يا نونو</p>
            <input type="text" id="passInput" placeholder="اليوم/الشهر/السنة">
            <button class="magic-btn" style="width: 100%;" onclick="unlock()">فتح 🔓</button>

        <button class="enter-btn" onclick="startEverything()">افتح الهدية 🎁</button>

            <div class="nono-heart-container">

                <div class="wheel-pointer"></div>
                <div id="wheel"></div>
                <button class="magic-btn" onclick="spinWheel()">لف العجلة وشوف حظك 🎡</button>
