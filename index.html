<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Nono! 🎂</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* درجات بينك أغمق وقوية */
            --main-pink: #d81b60; 
            --dark-pink: #880e4f;
            --bg-pink: #fce4ec;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-pink);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* صندوق كلمة السر */
        #password-screen {
            background: white;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            text-align: center;
            z-index: 1000;
            border: 4px solid var(--main-pink);
            width: 85%;
            max-width: 400px;
        }

        #password-screen h2 {
            color: var(--dark-pink);
            margin-bottom: 25px;
            font-size: 22px;
        }

        input {
            padding: 15px;
            width: 90%;
            border: 2px solid #ffc1e3;
            border-radius: 15px;
            font-size: 18px;
            text-align: center;
            outline: none;
            color: var(--dark-pink);
            background: #fff5f8;
        }

        input:focus { border-color: var(--main-pink); }

        button {
            margin-top: 20px;
            padding: 12px 40px;
            background: var(--main-pink);
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(216, 27, 96, 0.3);
        }

        button:hover { background: var(--dark-pink); transform: scale(1.05); }

        /* رسالة الخطأ */
        #error {
            color: #e91e63;
            font-weight: bold;
            margin-top: 15px;
            display: none;
            font-size: 14px;
        }

        /* المحتوى بعد الدخول */
        #main-content {
            display: none;
            text-align: center;
            animation: fadeIn 1.2s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .cake { font-size: 80px; margin: 20px 0; }
    </style>
</head>
<body>

    <div id="password-screen">
        <div style="font-size: 40px; margin-bottom: 10px;">🔐</div>
        <h2>اكتبي التاريخ السري يا نونو ✨</h2>
        <input type="text" id="passInput" placeholder="اليوم/الشهر/السنة">
        <br>
        <button onclick="checkPassword()">افتحي المفاجأة 🎁</button>
        <p id="error">جرب تاني يا نونو 😉</p>
    </div>

    <div id="main-content">
        <h1 style="color: var(--dark-pink); font-size: 2.5rem;">كل سنة وأنتِ منورة حياتنا! 🥳</h1>
        <div class="cake">🎂🎈💖</div>
        <p style="font-size: 1.3rem; color: var(--main-pink); max-width: 500px; margin: 0 auto; line-height: 1.6;">
            أجمل نونو في الدنيا كبرت سنة.. <br>
            يا رب تكون سنة حلوة زيك ومليانة فرحة.
        </p>
    </div>

    <script>
        function checkPassword() {
            const pass = document.getElementById('passInput').value.trim();
            const errorMsg = document.getElementById('error');
            
            // الباسورد المطلوب بالظبط
            if (pass === "20/4/2000") {
                document.getElementById('password-screen').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                document.body.style.backgroundColor = "#fce4ec";
            } else {
                errorMsg.style.display = 'block';
                // هز الشاشة لو الباسورد غلط (حركة كريتيف)
                const screen = document.getElementById('password-screen');
                screen.style.animation = 'shake 0.3s ease-in-out';
                setTimeout(() => screen.style.animation = '', 300);
            }
        }

        // إضافة حركة الهز
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-10px); }
                75% { transform: translateX(10px); }
            }
        `;
        document.head.appendChild(style);

        // تشغيل بالـ Enter
        document.getElementById('passInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') checkPassword();
        });
    </script>
</body>
</html>
